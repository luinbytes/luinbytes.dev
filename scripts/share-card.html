<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pond social preview source</title>
  <style>
    /* Reconstructed from the reviewed task patch for preview display only. */
    /* FONT_FACES */
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body { color: #edfff7; background: #061817; font-family: "Space Grotesk", sans-serif; }
    .pond, .shade { position: absolute; inset: 0; }
    .pond { width: 100%; height: 100%; object-fit: cover; image-rendering: pixelated; }
    .shade {
      background:
        linear-gradient(90deg, rgba(6, 24, 23, 0.94), rgba(6, 24, 23, 0.85) 43%, rgba(6, 24, 23, 0.2) 76%, rgba(6, 24, 23, 0.06)),
        linear-gradient(180deg, rgba(1, 18, 18, 0.12), transparent 52%, rgba(1, 18, 18, 0.45));
    }
    header {
      position: absolute; left: 48px; top: 32px; width: 1104px; height: 58px;
      display: flex; align-items: center; justify-content: space-between; padding: 0 18px;
      border: 1px solid rgba(235, 255, 248, 0.65); border-radius: 16px;
      background: rgba(224, 250, 239, 0.9); color: #061817;
      box-shadow: 0 12px 38px rgba(0, 24, 24, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.7);
    }
    .topline { font-family: "Space Mono", monospace; font-size: 17px; font-weight: 700; letter-spacing: 0.01em; }
    .root { font-family: "Space Mono", monospace; font-size: 17px; font-weight: 400; }
    .site-name { position: absolute; left: 64px; top: 135px; margin: 0; font-size: 78px; font-weight: 700; line-height: 1; letter-spacing: -0.06em; }
    .site-name::after {
      content: ""; display: block; width: 168px; height: 5px; margin-top: 25px;
      background: #91eee0; box-shadow: 0 0 20px rgba(145, 238, 224, 0.35);
    }
    .tagline {
      position: absolute; left: 64px; top: 270px; width: 525px; margin: 0;
      font-family: "Space Mono", monospace; font-size: 29px; font-weight: 400;
      line-height: 1.3; color: #edfff7; text-shadow: 0 3px 18px rgba(0, 24, 24, 0.35);
    }
    .topics {
      position: absolute; left: 64px; top: 478px; margin: 0;
      font-family: "Space Mono", monospace; font-size: 15px; font-weight: 700;
      line-height: 1.3; white-space: nowrap; color: #91eee0;
    }
    .divider {
      position: absolute; left: 48px; top: 455px; width: 1104px; height: 1px;
      background: rgba(227, 255, 245, 0.4);
    }
    .watermark {
      position: absolute; left: 620px; top: 295px; margin: 0;
      font-family: "Space Mono", monospace; font-size: 236px; font-weight: 700;
      line-height: 1; letter-spacing: -0.14em; color: rgba(145, 238, 224, 0.16);
    }
    .role, .actions { position: absolute; top: 550px; margin: 0; font-family: "Space Mono", monospace; font-size: 15px; line-height: 1.3; }
    .role { left: 64px; color: rgba(237, 255, 247, 0.72); }
    .actions { right: 64px; color: rgba(237, 255, 247, 0.72); }
    .sprite { position: absolute; overflow: hidden; image-rendering: pixelated; }
    .sprite img { display: block; width: 400%; max-width: none; }
    .koi { width: 90px; height: 90px; opacity: 0.92; filter: drop-shadow(4px 6px 3px rgba(0, 24, 24, 0.3)); }
    .koi-one { left: 867px; top: 354px; transform: rotate(32deg); }
    .koi-two { left: 824px; top: 212px; width: 70px; height: 70px; transform: rotate(-36deg); opacity: 0.8; }
    .koi-two img { transform: translateY(-25%); }
    .koi-three { left: 956px; top: 464px; width: 64px; height: 64px; transform: rotate(58deg); opacity: 0.78; }
    .koi-three img { transform: translateY(-75%); }
    .cat { left: 994px; top: 251px; width: 108px; height: 108px; filter: drop-shadow(0 4px 2px rgba(0, 24, 24, 0.28)); }
  </style>
</head>
<body>
  <img class="pond" src="../public/images/portfolio/pixel-pond-world.webp" alt="">
  <div class="shade"></div>
  <div class="sprite koi koi-one" aria-hidden="true"><img src="../public/images/portfolio/pixel-koi-atlas.webp" alt=""></div>
  <div class="sprite koi koi-two" aria-hidden="true"><img src="../public/images/portfolio/pixel-koi-atlas.webp" alt=""></div>
  <div class="sprite koi koi-three" aria-hidden="true"><img src="../public/images/portfolio/pixel-koi-atlas.webp" alt=""></div>
  <div class="sprite cat" aria-hidden="true"><img src="../public/images/portfolio/pixel-tabby-atlas.webp" alt=""></div>
  <header>
    <span class="topline" data-copy>INDEPENDENT SOFTWARE / FIELD NOTES</span>
    <span class="root" data-copy>ROOT / 01</span>
  </header>
  <h1 class="site-name" data-copy>luinbytes.dev</h1>
  <p class="tagline" data-copy>I get annoyed, then I build the missing thing.</p>
  <div class="divider" aria-hidden="true"></div>
  <p class="topics" data-copy>ANDROID APPS · LINUX TOOLS · GAME SYSTEMS · AUTOMATION</p>
  <p class="watermark" aria-hidden="true" data-copy>6c75</p>
  <p class="role" data-copy>LU / SOFTWARE ENGINEER</p>
  <p class="actions" data-copy>BUILD / VERIFY / SHIP</p>
</body>
</html>
